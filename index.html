<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Funk Land</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { 
    overflow-x: hidden; 
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
  }
  body { 
    font-family: 'Vazirmatn', Tahoma, sans-serif; 
    background: #0a0014;
    color: #fff; 
    min-height: 100vh;
    min-height: 100dvh;
    user-select: none;
  }

  /* ============ اسپلش ساده (۵ ثانیه) ============ */
  #splash {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #1a0033 0%, #0a0014 100%);
    display: flex; 
    justify-content: center; 
    align-items: center;
    flex-direction: column;
    z-index: 9999;
    padding: 30px;
    text-align: center;
  }
  #splash h1 {
    font-size: clamp(2rem, 12vw, 4rem);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px #b366ff, 0 0 40px #8a2be2;
    margin-bottom: 15px;
    letter-spacing: 3px;
    animation: pulse 1.5s infinite ease-in-out;
  }
  @keyframes pulse { 
    0%,100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.05); opacity: 0.9; }
  }
  #splash p {
    color: #b366ff;
    font-size: 1rem;
    margin-bottom: 40px;
    opacity: 0.8;
  }
  #splash-btn {
    padding: 18px 50px;
    font-size: 1.2rem;
    font-weight: bold;
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #8a2be2, #b366ff);
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(138,43,226,0.5);
    animation: pulse 2s infinite;
    min-width: 220px;
    min-height: 60px;
    transition: transform 0.15s;
  }
  #splash-btn:active { transform: scale(0.95); }

  /* ============ اپ اصلی ============ */
  #app {
    display: none;
    padding-bottom: 100px;
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* هدر */
  .app-header {
    position: sticky;
    top: 0;
    background: rgba(10,0,20,0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 15px 20px;
    z-index: 100;
    border-bottom: 1px solid rgba(179,102,255,0.2);
    padding-top: max(15px, env(safe-area-inset-top));
  }
  .app-header h1 {
    font-size: 1.5rem;
    font-weight: 900;
    background: linear-gradient(90deg, #b366ff, #fff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
    text-align: center;
  }

  /* لیست آهنگ‌ها */
  .songs-list {
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .song-item {
    background: linear-gradient(135deg, rgba(138,43,226,0.2), rgba(138,43,226,0.08));
    border: 1px solid rgba(179,102,255,0.3);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .song-item:active {
    transform: scale(0.98);
    background: linear-gradient(135deg, rgba(138,43,226,0.3), rgba(138,43,226,0.15));
  }
  .song-item.playing {
    border-color: #b366ff;
    box-shadow: 0 0 25px rgba(179,102,255,0.4);
    background: linear-gradient(135deg, rgba(138,43,226,0.35), rgba(138,43,226,0.15));
  }

  /* آیکون پخش دایره‌ای */
  .song-play {
    flex-shrink: 0;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8a2be2, #b366ff);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(179,102,255,0.4);
    position: relative;
  }
  .song-play svg {
    width: 24px;
    height: 24px;
    fill: #fff;
    margin-right: -2px;
  }
  .song-play.playing svg.play-icon { display: none; }
  .song-play:not(.playing) svg.pause-icon { display: none; }
  .song-play.loading { pointer-events: none; }
  .song-play.loading svg { display: none; }
  .song-play.loading::after {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2.5px solid #fff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* اطلاعات آهنگ */
  .song-info {
    flex: 1;
    min-width: 0;
  }
  .song-name {
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .song-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: #b366ff;
  }
  .new-badge-mobile {
    background: linear-gradient(135deg, #ff00ff, #b366ff);
    color: #fff;
    font-size: 0.6rem;
    font-weight: 900;
    padding: 2px 7px;
    border-radius: 6px;
    box-shadow: 0 0 10px #ff00ff;
  }

  /* نوار پیشرفت کوچیک تو کارت */
  .mini-progress {
    position: absolute;
    bottom: 0;
    right: 0;
    left: 0;
    height: 3px;
    background: rgba(179,102,255,0.15);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .song-item.playing .mini-progress { opacity: 1; }
  .mini-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8a2be2, #b366ff);
    box-shadow: 0 0 8px #b366ff;
    transition: width 0.2s linear;
  }

  /* ============ پلیر پایین (Sticky) ============ */
  #bottom-player {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(180deg, rgba(26,0,51,0.98), rgba(10,0,20,0.98));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid rgba(179,102,255,0.3);
    padding: 12px 15px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 200;
    box-shadow: 0 -10px 40px rgba(138,43,226,0.3);
  }
  #bottom-player.active {
    transform: translateY(0);
  }

  .player-info {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .player-thumb {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, #8a2be2, #b366ff);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1.2rem;
  }
  .player-text {
    flex: 1;
    min-width: 0;
  }
  .player-name {
    font-size: 0.9rem;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .player-time {
    font-size: 0.7rem;
    color: #b366ff;
    font-family: monospace;
    direction: ltr;
    text-align: left;
  }

  .player-progress {
    height: 4px;
    background: rgba(179,102,255,0.2);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
    cursor: pointer;
    position: relative;
  }
  .player-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8a2be2, #b366ff);
    box-shadow: 0 0 8px #b366ff;
    transition: width 0.1s linear;
    position: relative;
  }
  .player-progress-fill::after {
    content: '';
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px #b366ff;
  }

  .player-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
  }
  .player-btn {
    background: none;
    border: none;
    padding: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s;
  }
  .player-btn:active { transform: scale(0.9); }
  .player-btn svg {
    width: 28px;
    height: 28px;
    fill: #b366ff;
    transition: fill 0.2s;
  }
  .player-btn:active svg { fill: #fff; }
  .player-btn.main-btn svg {
    width: 44px;
    height: 44px;
    fill: #fff;
    filter: drop-shadow(0 0 10px #b366ff);
  }
  .player-btn svg.play-icon { display: none; }
  .player-btn.playing svg.play-icon { display: block; }
  .player-btn.playing svg.pause-icon { display: none; }

  /* اسپیس پایین */
  .bottom-spacer {
    height: 120px;
  }

  /* حالت خالی */
  .empty-msg {
    text-align: center;
    color: #b366ff;
    padding: 60px 20px;
    font-size: 1rem;
  }
  .loading-msg {
    text-align: center;
    color: #b366ff;
    padding: 60px 20px;
    font-size: 1rem;
  }
  .loading-msg::after {
    content: '';
    display: inline-block;
    width: 16px;
    height: 16px;
    margin-right: 8px;
    border: 2px solid #b366ff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }

  /* Safe Area */
  @supports (padding: max(0px)) {
    .app-header { padding-top: max(15px, env(safe-area-inset-top)); }
  }
</style>
</head>
<body>

<!-- ============ اسپلش ============ -->
<div id="splash">
  <h1>FUNK LAND</h1>
  <p>💜 سرزمین فانک 💜</p>
  <button id="splash-btn">ورود</button>
</div>

<!-- ============ اپ ============ -->
<div id="app">
  <div class="app-header">
    <h1>FUNK LAND</h1>
  </div>

  <div class="songs-list" id="songs-list">
    <div class="loading-msg">در حال بارگذاری</div>
  </div>

  <div class="bottom-spacer"></div>
</div>

<!-- ============ پلیر پایین ============ -->
<div id="bottom-player">
  <div class="player-info">
    <div class="player-thumb">🎵</div>
    <div class="player-text">
      <div class="player-name" id="player-name">—</div>
      <div class="player-time" id="player-time">0:00 / 0:00</div>
    </div>
  </div>

  <div class="player-progress" id="player-progress">
    <div class="player-progress-fill" id="player-progress-fill"></div>
  </div>

  <div class="player-controls">
    <button class="player-btn" id="prev-btn" aria-label="قبلی">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
    </button>
    <button class="player-btn main-btn" id="play-pause-btn" aria-label="پخش">
      <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="pause-icon" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <button class="player-btn" id="next-btn" aria-label="بعدی">
      <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
  </div>
</div>

<script>
// ==================== تنظیمات ====================
const SONGS_URL = "songs.json";
const UPLOADS_PATH = "uploads/";

// ==================== وضعیت ====================
let songs = [];
let currentIndex = -1;
let currentAudio = null;
let isDragging = false;

// ==================== عناصر ====================
const splash = document.getElementById('splash');
const splashBtn = document.getElementById('splash-btn');
const app = document.getElementById('app');
const songsList = document.getElementById('songs-list');
const bottomPlayer = document.getElementById('bottom-player');
const playerName = document.getElementById('player-name');
const playerTime = document.getElementById('player-time');
const playerProgress = document.getElementById('player-progress');
const playerProgressFill = document.getElementById('player-progress-fill');
const playPauseBtn = document.getElementById('play-pause-btn');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

// ==================== لود ====================
async function loadSongs() {
  try {
    const res = await fetch(SONGS_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    songs = await res.json();

    // لینک
    songs = songs.map(s => ({
      ...s,
      link: UPLOADS_PATH + s.file,
      added_at: s.date || 0
    }));

    // مرتب‌سازی
    songs.sort((a, b) => (b.added_at || 0) - (a.added_at || 0));

    renderSongs();
  } catch (err) {
    console.log("خطا:", err);
    songsList.innerHTML = '<div class="empty-msg">خطا در بارگذاری آهنگ‌ها 😢</div>';
  }
}

// ==================== رندر ====================
function renderSongs() {
  if (!songs.length) {
    songsList.innerHTML = '<div class="empty-msg">هنوز آهنگی اضافه نشده 🎵</div>';
    return;
  }

  const NEW_THRESHOLD = 7 * 24 * 60 * 60;
  const now = Math.floor(Date.now() / 1000);

  songsList.innerHTML = songs.map((song, index) => {
    const isNew = song.added_at && (now - song.added_at) < NEW_THRESHOLD;
    return `
      <div class="song-item ${isNew ? 'is-new' : ''}" data-index="${index}">
        <div class="song-play" data-play="${index}">
          <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="pause-icon" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </div>
        <div class="song-info">
          <div class="song-name">${escapeHtml(song.name)}</div>
          <div class="song-meta">
            ${isNew ? '<span class="new-badge-mobile">جدید</span>' : ''}
            <span>♪ آهنگ ${index + 1}</span>
          </div>
        </div>
        <div class="mini-progress">
          <div class="mini-progress-fill"></div>
        </div>
      </div>
    `;
  }).join('');

  // Event listeners
  document.querySelectorAll('.song-item').forEach(item => {
    item.addEventListener('click', (e) => {
      const index = parseInt(item.dataset.index);
      playSong(index);
    });
  });
}

// ==================== پخش آهنگ ====================
function playSong(index) {
  if (index < 0 || index >= songs.length) return;

  // اگه همون آهنگه و داره پخش می‌شه → pause
  if (index === currentIndex && currentAudio && !currentAudio.paused) {
    currentAudio.pause();
    updatePlayState(false);
    return;
  }

  // اگه همون آهنگه و pause هست → play
  if (index === currentIndex && currentAudio && currentAudio.paused) {
    currentAudio.play();
    updatePlayState(true);
    return;
  }

  // آهنگ جدید
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.src = "";
  }

  currentIndex = index;
  const song = songs[index];

  currentAudio = new Audio();
  currentAudio.preload = "auto";
  currentAudio.src = song.link;

  // UI
  playerName.textContent = song.name;
  bottomPlayer.classList.add('active');

  // پخش
  currentAudio.play().then(() => {
    updatePlayState(true);
  }).catch(err => {
    console.log("خطای پخش:", err);
    playerTime.textContent = "خطا در پخش ❌";
  });

  // Event listeners
  currentAudio.addEventListener('timeupdate', updateProgress);
  currentAudio.addEventListener('loadedmetadata', updateProgress);
  currentAudio.addEventListener('ended', () => {
    updatePlayState(false);
    // برو به آهنگ بعدی
    if (currentIndex < songs.length - 1) {
      playSong(currentIndex + 1);
    }
  });
  currentAudio.addEventListener('error', () => {
    playerTime.textContent = "خطا در لود ❌";
  });
}

function updatePlayState(isPlaying) {
  // دکمه پلی پایین
  if (isPlaying) {
    playPauseBtn.classList.add('playing');
  } else {
    playPauseBtn.classList.remove('playing');
  }

  // آیکون آهنگ‌ها
  document.querySelectorAll('.song-play').forEach(el => el.classList.remove('playing'));
  document.querySelectorAll('.song-item').forEach(el => el.classList.remove('playing'));

  if (isPlaying && currentIndex >= 0) {
    const currentItem = document.querySelector(`.song-item[data-index="${currentIndex}"]`);
    if (currentItem) {
      currentItem.classList.add('playing');
      const playBtn = currentItem.querySelector('.song-play');
      if (playBtn) playBtn.classList.add('playing');
    }
  }
}

function updateProgress() {
  if (!currentAudio) return;
  const cur = currentAudio.currentTime || 0;
  const dur = currentAudio.duration || 0;
  const pct = dur ? (cur / dur) * 100 : 0;

  playerProgressFill.style.width = pct + '%';
  playerTime.textContent = formatTime(cur) + ' / ' + formatTime(dur);

  // آپدیت mini progress
  if (currentIndex >= 0) {
    const currentItem = document.querySelector(`.song-item[data-index="${currentIndex}"]`);
    if (currentItem) {
      const miniFill = currentItem.querySelector('.mini-progress-fill');
      if (miniFill) miniFill.style.width = pct + '%';
    }
  }
}

// ==================== دکمه‌های پلیر ====================
playPauseBtn.addEventListener('click', () => {
  if (!currentAudio) {
    // اگه هیچی پخش نمی‌شه، اولین آهنگ رو پخش کن
    if (songs.length > 0) playSong(0);
    return;
  }

  if (currentAudio.paused) {
    currentAudio.play();
    updatePlayState(true);
  } else {
    currentAudio.pause();
    updatePlayState(false);
  }
});

prevBtn.addEventListener('click', () => {
  if (songs.length === 0) return;
  if (currentAudio && currentAudio.currentTime > 3) {
    // اگه بیشتر از ۳ ثانیه گذشته، برگرد به اول
    currentAudio.currentTime = 0;
  } else if (currentIndex > 0) {
    playSong(currentIndex - 1);
  }
});

nextBtn.addEventListener('click', () => {
  if (songs.length === 0) return;
  if (currentIndex < songs.length - 1) {
    playSong(currentIndex + 1);
  }
});

// ==================== Seek ====================
function seekFromEvent(e) {
  if (!currentAudio || !currentAudio.duration) return;
  const rect = playerProgress.getBoundingClientRect();
  let clientX = e.clientX;
  if (e.touches && e.touches[0]) clientX = e.touches[0].clientX;
  if (e.changedTouches && e.changedTouches[0]) clientX = e.changedTouches[0].clientX;
  let x = clientX - rect.left;
  const pct = Math.max(0, Math.min(1, x / rect.width));
  currentAudio.currentTime = pct * currentAudio.duration;
  playerProgressFill.style.width = (pct * 100) + '%';
}

playerProgress.addEventListener('mousedown', (e) => { isDragging = true; seekFromEvent(e); });
document.addEventListener('mousemove', (e) => { if (isDragging) seekFromEvent(e); });
document.addEventListener('mouseup', () => { isDragging = false; });
playerProgress.addEventListener('touchstart', (e) => { isDragging = true; seekFromEvent(e); }, { passive: true });
playerProgress.addEventListener('touchmove', (e) => { if (isDragging) seekFromEvent(e); }, { passive: true });
playerProgress.addEventListener('touchend', () => { isDragging = false; });

// ==================== اسپلش ====================
splashBtn.addEventListener('click', () => {
  splash.style.transition = 'opacity 0.6s ease';
  splash.style.opacity = '0';
  setTimeout(() => {
    splash.style.display = 'none';
    app.style.display = 'block';
  }, 600);
});

// ==================== کمکی ====================
function formatTime(sec) {
  if (isNaN(sec) || !isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ==================== شروع ====================
loadSongs();
</script>
</body>
</html>
